<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!--
    ShikiFAV — the owner's S+F monogram, simplified source for 16 and 32 px.
    Base drawing: icon.svg. Raster pipeline: scripts/icons.sh.

    The white sheet is part of the drawing, not transparency. It also has to
    stay 1 px wide on every side: ink touching the edge merges with Chrome's
    dark toolbar and the mark loses its silhouette.

    WHY A SEPARATE SOURCE. Scaled straight down, the base drawing puts every
    horizontal edge on a fractional row: at 16 px each bar smears over three
    rows (one black, two grey) and the 0.7 px seam between the S and the F
    fills in. So this variant is drawn ON the 16 px grid — the coordinates
    below are pixels at 16 px, and at 32 px they are simply doubled.

      rows   1..3 top bar | 3..4 seam | 4..6 F crossbar | 6..7 counter
             7..9 middle bar | 9..12 lower counter + stem | 12..13 seam
             13..15 bottom bar          (row 0 and row 15 stay white)
      bowls  ellipses 3.077 x 4, centres (4.077, 5) and (11.923, 11);
             they overlap by one stroke, so the S geometry is the base one
      stroke 2 px on every bar (base drawing gives 1.74) — whole pixels, no
             grey rows; the F crossbar is thickened to 2 as well (base 1.44)
      seams  1 full white row each (base drawing gives 0.6 px)
      italic dx/dy = -0.4028, the base -0.5236 squeezed by the same amount as
             the drawing itself (14 wide instead of 17.9 at this height)

    The F crossbar is kept: dropping it opens the upper counter but the mark
    then reads as a struck-through S, not as S+F.
  -->
  <rect width="16" height="16" fill="#ffffff"/>
  <g fill="#000000">
    <!-- S: top bar, left bowl, middle bar, right bowl, bottom bar -->
    <path d="M13.954 1L4.077 1A3.077 4 0 0 0 4.077 9L11.923 9A1.538 2 0 0 1 11.923 13L2.882 13L2.077 15L11.923 15A3.077 4 0 0 0 11.923 7L4.077 7A1.538 2 0 0 1 4.077 3L13.148 3Z"/>
    <!-- F: crossbar + italic stem, one shape -->
    <path d="M6.506 4L12.226 4L11.423 6L7.440 6L5.024 12L3.286 12Z"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!--
    ShikiFav — the owner's S+F monogram, base source (48 and 128 px).
    Simplified twin for 16/32: icon-small.svg. Raster pipeline: scripts/icons.sh.

    The white sheet is part of the drawing, not transparency: the mark has to
    stay black-on-white on Chrome's dark toolbar. Do not turn it into alpha.

    CONSTRUCTION (path coordinates are design units, 309.4 x 242).
    Rebuilt — not traced — from assets/icon/sf-monogram/wordmark-store.png, the
    only source in which the two bowls are true circles (least-squares fit, rms
    0.10 px); the owner's mark-*.png are that drawing scaled non-uniformly into
    a square, so their bowls are ellipses.

      R = 68   outer radius of both bowls
      s = 30   stroke, uniform over the whole S
      r = 38   inner radius (R - s)
      bowls   left  centre (68, 68), right centre (241.4, 174)
              they overlap by exactly one stroke, so H = 4R - s = 242
      bars    top 0..30, middle 106..136, bottom 212..242
              each bar spans one bowl's inner edge to the other's outer edge
      italic  every cut end runs at dx/dy = -0.5236 (27.6 deg off vertical):
              top bar right end, bottom bar left end, F stem, F crossbar right
      F       stem 40.7..201.7 (perpendicular width 30, same as the S),
              crossbar 40.7..65.5 — 24.8, deliberately lighter than the S
      seams   ~11 of white above and below the stem separate F from S; the stem
              crosses the middle bar with no seam (it merges into it)

    The group transform stretches the mark into the square, as the owner's own
    PNGs do (309.4 x 242 becomes 109 x 109). Set both scale factors to 0.352295
    to get the undistorted mark with true circular bowls instead.
  -->
  <rect width="128" height="128" fill="#ffffff"/>
  <g transform="translate(9.5 9.5) scale(0.352295 0.450413)" fill="#000000">
    <!-- S: top bar, left bowl, middle bar, right bowl, bottom bar -->
    <path d="M286.30 0L68 0A68 68 0 0 0 68 136L241.40 136A38 38 0 0 1 241.40 212L39.55 212L23.84 242L241.40 242A68 68 0 0 0 241.40 106L68 106A38 38 0 0 1 68 30L270.59 30Z"/>
    <!-- F: crossbar + italic stem, one shape -->
    <path d="M129.24 40.70L253.53 40.70L240.54 65.50L150.12 65.50L78.81 201.70L44.94 201.70Z"/>
  </g>
</svg>
